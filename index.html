<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>صيدلية د. هشام إسماعيل - طلب دواء</title>
    
    <!-- إعدادات وأيقونة التطبيق للشاشة الرئيسية -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="صيدلية الدكتور">
    <meta name="theme-color" content="#1e40af">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='120' fill='%231e40af'/><circle cx='256' cy='256' r='180' fill='%233b82f6' opacity='0.5'/><text x='50%25' y='52%25' text-anchor='middle' font-size='190'>💊</text><text x='50%25' y='82%25' text-anchor='middle' font-size='60' font-weight='900' fill='white' font-family='sans-serif'>الدكتور</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='120' fill='%231e40af'/><circle cx='256' cy='256' r='180' fill='%233b82f6' opacity='0.5'/><text x='50%25' y='52%25' text-anchor='middle' font-size='190'>💊</text><text x='50%25' y='82%25' text-anchor='middle' font-size='60' font-weight='900' fill='white' font-family='sans-serif'>الدكتور</text></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=Tajawal:wght@800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', Tahoma, sans-serif; }
        html, body { height: 100%; overflow: hidden; background: #eff6ff; }
        body { display: flex; justify-content: center; align-items: center; padding: 4px; }
        .app-card { background: #ffffff; width: 100%; max-width: 420px; height: 100%; max-height: 98vh; border-radius: 20px; box-shadow: 0 8px 25px rgba(30,64,175,0.15); border: 1.5px solid #dbeafe; display: flex; flex-direction: column; justify-content: space-between; padding: 8px 12px; }
        
        .header { background: linear-gradient(135deg, #1e40af, #3b82f6); color: white; padding: 6px 10px; border-radius: 12px; text-align: center; box-shadow: 0 4px 12px rgba(37,99,235,0.2); }
        .header h2 { font-size: 14px; font-weight: 800; }
        .header p { font-size: 9.5px; opacity: 0.9; margin-top: 1px; }
        
        .doctor-title-box { text-align: center; margin: 1px 0; }
        .doctor-title {
            font-family: 'Cairo', 'Tajawal', sans-serif;
            font-size: clamp(34px, 10vw, 44px);
            font-weight: 900;
            line-height: 1.1;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 50%, #0284c7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
            animation: pulse-doctor-giant 1.8s infinite ease-in-out;
        }

        @keyframes pulse-doctor-giant {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 3px 5px rgba(30, 64, 175, 0.4)); }
            50% { transform: scale(1.1); filter: drop-shadow(0 5px 14px rgba(37, 99, 235, 0.85)); }
        }

        .form-area { display: flex; flex-direction: column; gap: 3.5px; }
        .input-box { width: 100%; padding: 5px 9px; border: 1.5px solid #cbd5e1; border-radius: 8px; font-size: 11px; outline: none; background: #f8fafc; }
        .input-box:focus { border-color: #2563eb; background: #ffffff; }
        .btn-gps { width: 100%; background: #eff6ff; color: #1e40af; border: 1.5px dashed #3b82f6; padding: 5px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 10.5px; }
        .gps-status { font-size: 9px; text-align: center; font-weight: bold; display: none; }
        #clientMap { width: 100%; height: 95px; border-radius: 10px; border: 1.5px solid #bfdbfe; }
        
        /* زر الاتصال بالصيدلية باللون الأزرق المتناسق */
        .btn-call-pharmacy {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1d4ed8, #2563eb);
            color: white;
            text-decoration: none;
            padding: 5px 10px;
            border-radius: 10px;
            box-shadow: 0 3px 8px rgba(29,78,216,0.25);
            margin: 3px 0;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .btn-call-pharmacy:active {
            transform: scale(0.98);
        }
        .btn-call-pharmacy .call-phone {
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 1px;
            direction: ltr;
        }
        .btn-call-pharmacy .call-text {
            font-size: 9.5px;
            opacity: 0.95;
            font-weight: 600;
            margin-top: 1px;
        }

        .actions { display: flex; gap: 5px; margin-top: 2px; }
        .btn-submit { flex: 2; background: linear-gradient(135deg, #1d4ed8, #2563eb); color: white; border: none; padding: 8px; border-radius: 10px; font-size: 12.5px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(29,78,216,0.3); }
        .btn-cancel { flex: 1; background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; padding: 8px; border-radius: 10px; font-size: 10.5px; font-weight: bold; cursor: pointer; display: none; }
        
        .pulse-footer { animation: pulse-glow 2.5s infinite ease-in-out; text-align: center; padding-top: 3px; border-top: 1px dashed #e2e8f0; }
        .pulse-footer .dr { font-size: 11px; font-weight: 800; color: #1e3a8a; }
        .pulse-footer .dev { font-size: 9.5px; font-weight: 700; color: #2563eb; }
        
        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); text-shadow: 0 0 4px rgba(37,99,235,0.3); }
            50% { transform: scale(1.03); text-shadow: 0 0 10px rgba(37,99,235,0.7); }
        }
    </style>
</head>
<body>

<div class="app-card">
    <div class="header">
        <h2>💊 صيدلية د. هشام إسماعيل</h2>
        <p>خدمة التوصيل السريع لجميع القرى والنجوع</p>
    </div>

    <div class="doctor-title-box">
        <h1 class="doctor-title">الدكتور</h1>
    </div>

    <div class="form-area">
        <input type="text" id="custName" class="input-box" placeholder="اسم العميل بالكامل">
        <input type="tel" id="custPhone" class="input-box" placeholder="رقم الهاتف (010xxxxxxxx)">
        <input type="text" id="custAddress" class="input-box" placeholder="القرية / النجع / علامة مميزة">
        
        <button class="btn-gps" onclick="getGPS()">📍 تحديد موقعي الدقيق (GPS)</button>
        <div id="gpsStatus" class="gps-status"></div>
        <div id="clientMap"></div>
    </div>

    <div>
        <!-- خانة الاتصال بالصيدلية لتحديث تفاصيل الطلب -->
        <a href="tel:01109690240" class="btn-call-pharmacy">
            <div class="call-phone">📞 01109690240</div>
            <div class="call-text">اتصل بالصيدلية لتحديث تفاصيل طلبك</div>
        </a>

        <div class="actions">
            <button class="btn-submit" id="submitBtn" onclick="sendOrder()">تأكيد وإرسال الطلب 🚀</button>
            <button class="btn-cancel" id="cancelBtn" onclick="cancelMyOrder()">❌ إلغاء الطلب</button>
        </div>

        <div class="pulse-footer">
            <div class="dr">صيدلية DR: Hisham Ismail</div>
            <div class="dev">By / ENG: Ahmed Al sayyad</div>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyAF--GbgtXOFouzlg082zwR_UXVrtDdxmI",
      authDomain: "app1-e712c.firebaseapp.com",
      projectId: "app1-e712c",
      storageBucket: "app1-e712c.firebasestorage.app",
      messagingSenderId: "413212540461",
      appId: "1:413212540461:web:725c7295ce6de8a00f82a4",
      databaseURL: "https://app1-e712c-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // مقر الصيدلية بالحرجة قبلي كبداية افتراضية
    let clientLat = 26.201767;
    let clientLng = 31.938367;

    document.getElementById('custName').value = localStorage.getItem('cust_name') || '';
    document.getElementById('custPhone').value = localStorage.getItem('cust_phone') || '';
    checkActiveOrder();

    const clientMap = L.map('clientMap', { zoomControl: false }).setView([clientLat, clientLng], 14);
    L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', { maxZoom: 20, subdomains: ['mt0', 'mt1', 'mt2', 'mt3'] }).addTo(clientMap);
    let marker = L.marker([clientLat, clientLng], {draggable: true}).addTo(clientMap);
    marker.bindPopup("منزلي 🏠 (اسحبه لتحديد الدقة)").openPopup();

    clientMap.on('click', e => { 
        clientLat = e.latlng.lat; 
        clientLng = e.latlng.lng; 
        marker.setLatLng([clientLat, clientLng]); 
    });
    marker.on('dragend', () => { 
        const p = marker.getLatLng(); 
        clientLat = p.lat; 
        clientLng = p.lng; 
    });

    function getGPS() {
        const s = document.getElementById('gpsStatus');
        s.style.display = 'block'; 
        s.innerText = "جاري التقاط إحداثيات GPS...";
        s.style.color = "#1d4ed8";

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                pos => {
                    const acc = Math.round(pos.coords.accuracy);
                    if (acc > 3000) {
                        s.innerText = `⚠️ تم الالتقاط عبر النت (${Math.round(acc/1000)} كم خطأ) - افتح من الموبايل أو حرّك الدبوس`;
                        s.style.color = "#d97706";
                    } else {
                        clientLat = pos.coords.latitude; 
                        clientLng = pos.coords.longitude;
                        clientMap.setView([clientLat, clientLng], 16);
                        marker.setLatLng([clientLat, clientLng]);
                        s.innerText = `✅ تم تحديد موقعك الحقيقي بدقة (${acc} متر)`;
                        s.style.color = "#16a34a";
                    }
                },
                () => { 
                    s.innerText = "⚠️ تعذر أخذ GPS تلقائياً، حدد مكانك بالخريطة"; 
                    s.style.color = "#dc2626";
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }
    }

    function sendOrder() {
        const name = document.getElementById('custName').value.trim();
        const phone = document.getElementById('custPhone').value.trim();
        const address = document.getElementById('custAddress').value.trim();
        if (!name || !phone) { alert('يرجى كتابة الاسم ورقم الهاتف'); return; }

        localStorage.setItem('cust_name', name);
        localStorage.setItem('cust_phone', phone);

        const newRef = db.ref('orders').push();
        newRef.set({
            name: name, phone: phone, address: address || "الحرجة / البلينا",
            lat: clientLat, lng: clientLng, status: "جديد",
            time: new Date().toLocaleTimeString('ar-EG')
        }).then(() => {
            localStorage.setItem('my_active_order', newRef.key);
            alert('🚀 تم إرسال طلبك لصيدلية د. هشام إسماعيل بنجاح!');
            checkActiveOrder();
        });
    }

    function checkActiveOrder() {
        const orderId = localStorage.getItem('my_active_order');
        const cancelBtn = document.getElementById('cancelBtn');
        if (orderId) {
            cancelBtn.style.display = 'block';
        } else {
            cancelBtn.style.display = 'none';
        }
    }

    function cancelMyOrder() {
        const orderId = localStorage.getItem('my_active_order');
        if (!orderId) return;
        if (confirm('هل أنت متأكد من رغبتك في إلغاء هذا الطلب؟')) {
            db.ref('orders/' + orderId).remove().then(() => {
                localStorage.removeItem('my_active_order');
                alert('تم إلغاء الطلب بنجاح ❌');
                checkActiveOrder();
            });
        }
    }
</script>
</body>
</html>
