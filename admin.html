<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة - صيدلية د. هشام إسماعيل</title>
    
    <!-- إعدادات وأيقونة لوحة الإدارة للشاشة الرئيسية -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="إدارة الصيدلية">
    <meta name="theme-color" content="#1e40af">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='120' fill='%231e3a8a'/><circle cx='256' cy='256' r='180' fill='%232563eb' opacity='0.5'/><text x='50%25' y='54%25' text-anchor='middle' font-size='190'>📊</text><text x='50%25' y='84%25' text-anchor='middle' font-size='60' font-weight='900' fill='%2360a5fa' font-family='sans-serif'>الإدارة</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='120' fill='%231e3a8a'/><circle cx='256' cy='256' r='180' fill='%232563eb' opacity='0.5'/><text x='50%25' y='54%25' text-anchor='middle' font-size='190'>📊</text><text x='50%25' y='84%25' text-anchor='middle' font-size='60' font-weight='900' fill='%2360a5fa' font-family='sans-serif'>الإدارة</text></svg>">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #f1f5f9; color: #1e293b; padding: 15px; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { background: linear-gradient(135deg, #1e40af, #2563eb); color: white; padding: 18px 24px; border-radius: 16px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(37,99,235,0.2); margin-bottom: 20px; }
        .header h1 { font-size: 18px; font-weight: 800; }
        .stats-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .stat-card { background: white; padding: 14px; border-radius: 12px; border: 1px solid #e2e8f0; text-align: center; }
        .stat-card span { font-size: 12px; color: #64748b; font-weight: 600; display: block; }
        .stat-card strong { font-size: 20px; color: #1e40af; margin-top: 4px; display: block; }
        .order-card { background: white; border-radius: 14px; padding: 16px; margin-bottom: 12px; border: 1.5px solid #e2e8f0; box-shadow: 0 2px 8px rgba(0,0,0,0.04); display: flex; flex-direction: column; gap: 10px; }
        .order-card.new-order { border-right: 5px solid #2563eb; background: #f8faff; }
        .order-header { display: flex; justify-content: space-between; align-items: center; }
        .badge { padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: bold; }
        .badge-new { background: #dbeafe; color: #1e40af; }
        .badge-driver { background: #fef3c7; color: #b45309; }
        .badge-done { background: #dcfce7; color: #15803d; }
        .order-details { font-size: 13px; color: #475569; line-height: 1.6; }
        .order-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn { padding: 8px 14px; border-radius: 8px; border: none; font-size: 12px; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; text-decoration: none; }
        .btn-assign { background: #2563eb; color: white; }
        .btn-done { background: #10b981; color: white; }
        .btn-delete { background: #fee2e2; color: #dc2626; }
        .btn-call { background: #f1f5f9; color: #334155; }
        .pulse-footer { animation: pulse-glow 2.5s infinite ease-in-out; text-align: center; padding: 20px 0; margin-top: 20px; border-top: 1px dashed #cbd5e1; }
        .pulse-footer .dr { font-size: 14px; font-weight: 800; color: #1e40af; }
        .pulse-footer .dev { font-size: 12px; font-weight: 700; color: #2563eb; }
        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); text-shadow: 0 0 6px rgba(37,99,235,0.3); }
            50% { transform: scale(1.02); text-shadow: 0 0 12px rgba(37,99,235,0.6); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div>
            <h1>💊 لوحة إدارة الطلبات</h1>
            <p style="font-size: 12px; opacity: 0.9;">صيدلية د. هشام إسماعيل (الحرجة قبلي)</p>
        </div>
        <button onclick="enableSound()" id="soundBtn" class="btn" style="background:white; color:#1e40af;">🔔 تفعيل صوت التنبيه</button>
    </div>

    <div class="stats-cards">
        <div class="stat-card"><span>طلبات جديدة</span><strong id="countNew">0</strong></div>
        <div class="stat-card"><span>مع المندوب</span><strong id="countDriver">0</strong></div>
        <div class="stat-card"><span>تم التسليم</span><strong id="countDone">0</strong></div>
    </div>

    <div id="ordersList">
        <p style="text-align:center; color:#94a3b8; padding:30px;">جاري تحميل الطلبات...</p>
    </div>

    <div class="pulse-footer">
        <div class="dr">صيدلية DR: Hisham Ismail</div>
        <div class="dev">By / ENG: Ahmed Al sayyad</div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyAF--GbgtXOFouzlg082zwR_UXVrtDdxmI",
      authDomain: "app1-e712c.firebaseapp.com",
      projectId: "app1-e712c",
      storageBucket: "app1-e712c.firebasestorage.app",
      messagingSenderId: "413212540461",
      appId: "1:413212540461:web:725c7295ce6de8a00f82a4",
      databaseURL: "https://app1-e712c-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let isSoundEnabled = false;
    let audioCtx = null;
    let initialLoad = true;

    function enableSound() {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        isSoundEnabled = true;
        document.getElementById('soundBtn').innerText = '✅ التنبيه الصوتي مفعل';
        document.getElementById('soundBtn').style.background = '#dcfce7';
        document.getElementById('soundBtn').style.color = '#15803d';
    }

    function playBeep() {
        if (!isSoundEnabled || !audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
        osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.4);
    }

    db.ref('orders').on('value', snapshot => {
        const data = snapshot.val();
        const list = document.getElementById('ordersList');

        if (!data) {
            list.innerHTML = '<p style="text-align:center; color:#94a3b8; padding:30px;">لا توجد أي طلبات حالياً</p>';
            updateCounts(0,0,0);
            return;
        }

        let cNew = 0, cDriver = 0, cDone = 0;
        let html = '';

        const keys = Object.keys(data).reverse();
        keys.forEach(key => {
            const o = data[key];
            let badgeClass = 'badge-new';
            if (o.status === 'جديد') cNew++;
            else if (o.status === 'مع المندوب') { cDriver++; badgeClass = 'badge-driver'; }
            else if (o.status === 'تم التسليم') { cDone++; badgeClass = 'badge-done'; }

            html += `
                <div class="order-card ${o.status === 'جديد' ? 'new-order' : ''}">
                    <div class="order-header">
                        <strong>👤 ${o.name}</strong>
                        <span class="badge ${badgeClass}">${o.status}</span>
                    </div>
                    <div class="order-details">
                        <p>📍 <strong>العنوان:</strong> ${o.address}</p>
                        <p>🕒 <strong>التوقيت:</strong> ${o.time || '--'}</p>
                    </div>
                    <div class="order-actions">
                        <a href="tel:${o.phone}" class="btn btn-call">📞 ${o.phone}</a>
                        ${o.status === 'جديد' ? `<button class="btn btn-assign" onclick="updateStatus('${key}', 'مع المندوب')">🚴 إسناد للمندوب</button>` : ''}
                        ${o.status === 'مع المندوب' ? `<button class="btn btn-done" onclick="updateStatus('${key}', 'تم التسليم')">✅ تم التسليم</button>` : ''}
                        <button class="btn btn-delete" onclick="deleteOrder('${key}')">🗑️ حذف</button>
                    </div>
                </div>
            `;
        });

        if (!initialLoad && cNew > 0) playBeep();
        initialLoad = false;

        list.innerHTML = html;
        updateCounts(cNew, cDriver, cDone);
    });

    function updateCounts(n, dr, dn) {
        document.getElementById('countNew').innerText = n;
        document.getElementById('countDriver').innerText = dr;
        document.getElementById('countDone').innerText = dn;
    }

    function updateStatus(id, st) { db.ref('orders/' + id).update({ status: st }); }
    function deleteOrder(id) { if (confirm('هل تريد مسح هذا الأوردر نهائياً؟')) db.ref('orders/' + id).remove(); }
</script>
</body>
</html>
