<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>كابتن التوصيل - صيدلية د. هشام إسماعيل</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        html, body { height: 100%; overflow: hidden; background: #0f172a; }
        body { display: flex; justify-content: center; align-items: center; padding: 8px; }
        .app-card { background: #1e293b; width: 100%; max-width: 440px; height: 100%; max-height: 98vh; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); border: 1.5px solid #334155; display: flex; flex-direction: column; justify-content: space-between; padding: 12px; }
        .header { display: flex; justify-content: space-between; align-items: center; background: linear-gradient(135deg, #1e40af, #2563eb); color: white; padding: 10px 14px; border-radius: 14px; }
        .header h2 { font-size: 15px; font-weight: 800; }
        .status-badge { background: #0284c7; color: #ffffff; padding: 3px 8px; border-radius: 8px; font-size: 11px; font-weight: bold; }
        .meta-box { background: #0f172a; padding: 8px 12px; border-radius: 10px; border: 1px solid #334155; font-size: 12px; color: #cbd5e1; }
        .meta-box strong { color: #f8fafc; }
        #map { width: 100%; height: 180px; border-radius: 12px; border: 1.5px solid #475569; z-index: 1; }
        .leaflet-routing-container { display: none !important; }
        .stats-bar { display: flex; justify-content: space-around; background: #0f172a; padding: 8px; border-radius: 10px; border: 1px solid #334155; }
        .stat-item { text-align: center; }
        .stat-item span { font-size: 10px; color: #94a3b8; display: block; }
        .stat-item strong { font-size: 13px; color: #38bdf8; }
        .btn-call { display: block; text-align: center; background: #334155; color: white; text-decoration: none; padding: 9px; border-radius: 10px; font-weight: bold; font-size: 12px; }
        .btn-done { width: 100%; background: linear-gradient(135deg, #10b981, #059669); color: white; border: none; padding: 11px; border-radius: 10px; font-weight: bold; font-size: 14px; cursor: pointer; }
        .pulse-footer { animation: pulse-glow 2.5s infinite ease-in-out; text-align: center; padding-top: 4px; border-top: 1px dashed #334155; }
        .pulse-footer .dr { font-size: 11.5px; font-weight: 800; color: #60a5fa; }
        .pulse-footer .dev { font-size: 10px; font-weight: 700; color: #93c5fd; }
        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); text-shadow: 0 0 5px rgba(96,165,250,0.4); }
            50% { transform: scale(1.03); text-shadow: 0 0 12px rgba(96,165,250,0.8); }
        }
    </style>
</head>
<body>

<div class="app-card" id="driverContainer">
    <div class="header">
        <h2>🚴 كابتن التوصيل</h2>
        <span class="status-badge">مباشر 🟢</span>
    </div>

    <div id="activeContent" style="display:flex; flex-direction:column; gap:6px;">
        <p style="text-align:center; color:#94a3b8; padding:30px 0; font-size:13px;">في انتظار إسناد أوردرات من الإدارة...</p>
    </div>

    <div class="pulse-footer">
        <div class="dr">صيدلية DR: Hisham Ismail</div>
        <div class="dev">By / ENG: Ahmed Al sayyad</div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyAF--GbgtXOFouzlg082zwR_UXVrtDdxmI",
      authDomain: "app1-e712c.firebaseapp.com",
      projectId: "app1-e712c",
      storageBucket: "app1-e712c.firebasestorage.app",
      messagingSenderId: "413212540461",
      appId: "1:413212540461:web:725c7295ce6de8a00f82a4",
      databaseURL: "https://app1-e712c-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const pharmacyLoc = [26.201767, 31.938367]; // الحرجة قبلي
    let map = null, routingControl = null, driverMarker = null, watchId = null;

    db.ref('orders').on('value', snapshot => {
        const data = snapshot.val();
        const content = document.getElementById('activeContent');
        if (!data) return;

        let activeKey = null;
        Object.keys(data).forEach(k => { if (data[k].status === 'مع المندوب') activeKey = k; });

        if (!activeKey) {
            content.innerHTML = '<p style="text-align:center; color:#94a3b8; padding:35px 0; font-size:13px;">لا توجد مهام حالية.. في انتظار أوردر جديد 🚴</p>';
            if (watchId) navigator.geolocation.clearWatch(watchId);
            return;
        }

        const o = data[activeKey];
        content.innerHTML = `
            <div class="meta-box">
                <p>👤 <strong>العميل:</strong> ${o.name} | 📍 ${o.address}</p>
            </div>
            <div id="map"></div>
            <div class="stats-bar">
                <div class="stat-item"><span>المتبقي</span><strong id="distText">--</strong></div>
                <div class="stat-item"><span>الوقت</span><strong id="timeText" style="color:#34d399;">--</strong></div>
            </div>
            <a href="tel:${o.phone}" class="btn-call">📞 اتصال بالعميل (${o.phone})</a>
            <button class="btn-done" onclick="finishDelivery('${activeKey}')">✅ تم تسليم الأوردر</button>
        `;
        initLiveRoute(o.lat, o.lng);
    });

    function initLiveRoute(destLat, destLng) {
        if (map) map.remove();
        map = L.map('map', { zoomControl: false }).setView(pharmacyLoc, 13);
        L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', { maxZoom: 20, subdomains: ['mt0','mt1','mt2','mt3'] }).addTo(map);

        const destPoint = L.latLng(destLat, destLng);
        L.marker(destPoint).addTo(map).bindPopup('📍 بيت العميل');
        L.marker(pharmacyLoc).addTo(map).bindPopup('🏪 صيدلية د. هشام إسماعيل');

        if (navigator.geolocation) {
            watchId = navigator.geolocation.watchPosition(
                pos => {
                    const currentPos = L.latLng(pos.coords.latitude, pos.coords.longitude);
                    if (!driverMarker) {
                        driverMarker = L.marker(currentPos, {
                            icon: L.divIcon({ html: '🛵', className: 'driver-ico', iconSize: [25, 25] })
                        }).addTo(map);
                    } else {
                        driverMarker.setLatLng(currentPos);
                    }

                    if (!routingControl) {
                        routingControl = L.Routing.control({
                            waypoints: [currentPos, destPoint],
                            lineOptions: { styles: [{ color: '#38bdf8', opacity: 0.9, weight: 6 }] },
                            router: L.Routing.osrmv1({ serviceUrl: 'https://router.project-osrm.org/route/v1' }),
                            addWaypoints: false, draggableWaypoints: false, fitSelectedRoutes: false, show: false
                        }).addTo(map);
                        routingControl.on('routesfound', e => {
                            const s = e.routes[0].summary;
                            document.getElementById('distText').innerText = (s.totalDistance / 1000).toFixed(1) + ' كم';
                            document.getElementById('timeText').innerText = Math.round(s.totalTime / 60) + ' دقيقة';
                        });
                    } else {
                        routingControl.setWaypoints([currentPos, destPoint]);
                    }
                },
                null,
                { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
            );
        }
    }

    function finishDelivery(key) {
        if (confirm('تأكيد إتمام التوصيل بنجاح؟')) {
            db.ref('orders/' + key).update({ status: 'تم التسليم' });
        }
    }
</script>
</body>
</html>
