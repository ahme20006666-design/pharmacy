<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق المندوب - صيدلية البلينا</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #0f172a; color: #f8fafc; padding: 15px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 450px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .card { background: #1e293b; border-radius: 20px; padding: 18px; border: 1px solid #334155; }
        #map { width: 100%; height: 350px; border-radius: 14px; margin: 12px 0; border: 1px solid #475569; z-index: 1; }
        .leaflet-routing-container { display: none !important; }
        .stats { display: flex; justify-content: space-around; background: #0f172a; padding: 10px; border-radius: 12px; margin-bottom: 12px; }
        .btn-done { width: 100%; background: #10b981; color: #064e3b; border: none; padding: 14px; border-radius: 12px; font-weight: bold; font-size: 15px; cursor: pointer; }
        .btn-call { display: block; text-align: center; background: #334155; color: white; text-decoration: none; padding: 10px; border-radius: 10px; margin-bottom: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2 style="color: #34d399;">🚴 كابتن التوصيل (مباشر)</h2>
        <span style="background: #064e3b; color: #34d399; padding: 4px 10px; border-radius: 10px; font-size: 12px;">متصل 🟢</span>
    </div>

    <div class="card" id="driverBox">
        <p style="text-align: center; color: #94a3b8;">في انتظار إسناد طلبات من الإدارة...</p>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyAF--GbgtXOFouzlg082zwR_UXVrtDdxmI",
      authDomain: "app1-e712c.firebaseapp.com",
      projectId: "app1-e712c",
      storageBucket: "app1-e712c.firebasestorage.app",
      messagingSenderId: "413212540461",
      appId: "1:413212540461:web:725c7295ce6de8a00f82a4",
      databaseURL: "https://app1-e712c-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // إحداثيات مقر الصيدلية الثابتة (الحرجة قبلي)
    const pharmacyLoc = [26.201767, 31.938367]; 
    let map = null, routingControl = null;
    let driverMarker = null;
    let watchId = null;

    db.ref('orders').on('value', snapshot => {
        const data = snapshot.val();
        if (!data) return;

        let activeKey = null;
        Object.keys(data).forEach(key => {
            if (data[key].status === 'مع المندوب') activeKey = key;
        });

        const box = document.getElementById('driverBox');
        if (!activeKey) {
            box.innerHTML = '<p style="text-align:center; color:#94a3b8;">لا توجد مهام حالية.. في انتظار أوردر جديد 🚴</p>';
            if (watchId) navigator.geolocation.clearWatch(watchId);
            return;
        }

        const activeOrder = data[activeKey];
        box.innerHTML = `
            <h3 style="color: #f8fafc; margin-bottom: 5px;">📦 طلب توصيل جديد</h3>
            <p style="font-size: 13px; color: #cbd5e1;">👤 <strong>العميل:</strong> ${activeOrder.name}</p>
            <p style="font-size: 13px; color: #cbd5e1;">📍 <strong>العنوان:</strong> ${activeOrder.address}</p>
            
            <div id="map"></div>

            <div class="stats">
                <div><span>المتبقي:</span> <strong id="distText" style="color:#38bdf8;">--</strong></div>
                <div><span>الوقت:</span> <strong id="timeText" style="color:#34d399;">--</strong></div>
            </div>

            <a href="tel:${activeOrder.phone}" class="btn-call">📞 اتصال بالعميل</a>
            <button class="btn-done" onclick="finishDelivery('${activeKey}')">✅ تم تسليم الأوردر</button>
        `;

        initLiveTracking(activeOrder.lat, activeOrder.lng);
    });

    function initLiveTracking(destLat, destLng) {
        if (map) map.remove();
        
        map = L.map('map').setView(pharmacyLoc, 14);

        L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
        }).addTo(map);

        // علامة بيت العميل الثابتة
        const destPoint = L.latLng(destLat, destLng);
        L.marker(destPoint).addTo(map).bindPopup('📍 بيت العميل');

        // بدء تتبع حركة المندوب لحظياً عبر GPS الموبايل
        if (navigator.geolocation) {
            watchId = navigator.geolocation.watchPosition(
                (pos) => {
                    const currentLat = pos.coords.latitude;
                    const currentLng = pos.coords.longitude;
                    const currentPos = L.latLng(currentLat, currentLng);

                    // تحديث مكان دراجة المندوب على الخريطة
                    if (!driverMarker) {
                        driverMarker = L.marker(currentPos, {
                            icon: L.divIcon({ html: '🛵', className: 'driver-icon', iconSize: [30, 30] })
                        }).addTo(map).bindPopup('أنت هنا (المندوب)').openPopup();
                    } else {
                        driverMarker.setLatLng(currentPos);
                    }

                    // تحديث رسم الخط والمسافة كلما تحرك المندوب (الخط بيقصر تلقائياً)
                    if (!routingControl) {
                        routingControl = L.Routing.control({
                            waypoints: [currentPos, destPoint],
                            lineOptions: { styles: [{ color: '#2563eb', opacity: 0.9, weight: 6 }] },
                            router: L.Routing.osrmv1({ serviceUrl: 'https://router.project-osrm.org/route/v1' }),
                            addWaypoints: false,
                            draggableWaypoints: false,
                            fitSelectedRoutes: false,
                            show: false
                        }).addTo(map);

                        routingControl.on('routesfound', e => {
                            const summary = e.routes[0].summary;
                            document.getElementById('distText').innerText = (summary.totalDistance / 1000).toFixed(1) + ' كم';
                            document.getElementById('timeText').innerText = Math.round(summary.totalTime / 60) + ' دقيقة';
                        });
                    } else {
                        routingControl.setWaypoints([currentPos, destPoint]);
                    }
                },
                (err) => { console.log("خطأ في تحديد الـ GPS للمندوب"); },
                { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
            );
        }
    }

    function finishDelivery(orderId) {
        if (watchId) navigator.geolocation.clearWatch(watchId);
        db.ref('orders/' + orderId).update({
            status: 'تم التسليم بنجاح'
        }).then(() => alert('عاش يا بطل! تم إنهاء التوصيل.'));
    }
</script>
</body>
</html>
